name: Release

# Manually dispatched. Runs release:prepare and release:perform on an ephemeral runner, so no
# release.properties or pom.xml.releaseBackup files are left in anybody's checkout. The plugin
# commits the release version, tags it (bare version, no prefix), commits the next SNAPSHOT and
# pushes all three to main; release:perform then deploys the tagged build to GitHub Packages.

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (blank: the current version without -SNAPSHOT)'
        required: false
      developmentVersion:
        description: 'Next development version (blank: the next patch, with -SNAPSHOT)'
        required: false

permissions:
  contents: write    # push the release commits and tag, create the GitHub release
  packages: write    # deploy to GitHub Packages

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java 25 (with GitHub Packages auth)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Install the JavaFX toolkit's runtime libraries and a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxxf86vm1

      - name: Prepare the release (verify, tag, bump to the next SNAPSHOT, push)
        # The push uses the checkout's https credentials, which is why the pom's developerConnection is https.
        run: |
          args=(--batch-mode)
          [ -n "${{ inputs.releaseVersion }}" ]     && args+=(-DreleaseVersion=${{ inputs.releaseVersion }})
          [ -n "${{ inputs.developmentVersion }}" ] && args+=(-DdevelopmentVersion=${{ inputs.developmentVersion }})
          xvfb-run -a mvn "${args[@]}" release:prepare

      - name: Record the release tag
        # release:perform deletes release.properties when it succeeds, so read the tag now.
        id: tag
        run: |
          tag=$(grep '^scm.tag=' release.properties | cut -d= -f2)
          [ -n "${tag}" ] || tag=$(git tag --points-at HEAD~1 | head -n1)
          [ -n "${tag}" ] || { echo "::error::Could not determine the release tag"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Perform the release (deploy the tagged build to GitHub Packages)
        run: mvn --batch-mode release:perform -Darguments=-DskipTests
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "${TAG}" --title "${TAG}" --generate-notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
